name: Build desktop app

# Packages the Camoufox Manager GUI (Audit tab included) as a standalone
# single-file application, so it can be handed to someone who has no Python:
# one .exe on Windows, one binary on Linux, one .app on macOS. Nothing to unzip.
#
# PyInstaller does not cross-compile: each archive is built on the OS it runs on.
# That is why this job is a matrix over runner images rather than one job with a
# target flag -- there is no flag.
#
# Trigger:
#   * workflow_dispatch             -> build, downloadable via "Artifacts"
#   * push a "v*-gui" tag           -> build all three and attach to that Release
#
# Prefer workflow_dispatch. The repository already has a Build and Release
# workflow that fires on `tags: ["*"]` and cross-compiles the browser for the
# whole 9-job matrix, so pushing any tag starts that too. Tagging is worth it
# only when the archives should be attached to a Release, and the prefix below
# at least keeps this workflow off the version tags.
#
# The browser is deliberately not bundled. It is ~470 MB per platform, is fetched
# at runtime by `camoufox fetch`, and its install path is recorded absolutely, so
# bundling it would break as soon as the folder moved.

on:
  workflow_dispatch:
  # Runs on a pull request that touches the packaging files, so the pipeline is
  # exercised by the change that affects it rather than after it lands. The paths
  # filter keeps the three-archive build off unrelated pull requests.
  pull_request:
    paths:
      - "pythonlib/packaging/**"
      - ".github/workflows/package-gui.yml"
  push:
    tags:
      - "v*-gui"

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: CamoufoxGUI-windows-x64
            # The single file a user double-clicks.
            deliverable: dist/CamoufoxGUI-windows-x64.exe
          - name: linux-x64
            os: ubuntu-24.04
            artifact: CamoufoxGUI-linux-x64
            deliverable: dist/CamoufoxGUI-linux-x64
          - name: macos-arm64
            os: macos-14
            artifact: CamoufoxGUI-macos-arm64
            # A .app is a directory bundle, so it is zipped to keep its
            # structure and symlinks; on macOS that zip *is* the app to the user.
            deliverable: dist/CamoufoxGUI-macos-arm64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        # Qt needs these at runtime; the runner does not ship them. Without
        # libxkbcommon-x11 the offscreen check below cannot even create a
        # QGuiApplication, and without libEGL the app fails on a real desktop.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zip \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libdbus-1-3 libfontconfig1

      - name: Install the package and PyInstaller
        # From the git URL, not PyPI: the Audit tab is this repository's addition
        # and the published `camoufox` package is upstream's, without it.
        #
        # Pinned to github.sha rather than github.ref_name: on a pull_request event
        # ref_name is "<number>/merge", which is not a git ref and would fail.
        # github.sha is a real commit in both cases -- the merge commit for a pull
        # request, the tagged commit for a tag push.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "camoufox[gui] @ git+https://github.com/${{ github.repository }}.git@${{ github.sha }}#subdirectory=pythonlib"
          python -m pip install pyinstaller
          # Build-time only, never bundled: PyInstaller needs Pillow to convert the
          # .ico into the .icns that a macOS .app requires. Without it, BUNDLE
          # rejects the icon outright.
          python -m pip install pillow

      - name: Build
        # --clean discards the analysis cache; a stale cache would quietly ship
        # an old bundle.
        run: python -m PyInstaller pythonlib/packaging/camoufox-gui.spec --noconfirm --clean

      - name: Self-check the bundle (Linux)
        # The headless gate: runs the real single-file executable, which unpacks
        # itself and loads the actual QML under the offscreen Qt platform. It
        # catches the failures that are otherwise invisible -- a missing QML data
        # file, a Qt QML module left out, a broken audit bridge -- and it is also
        # the only step that proves the onefile extraction works at all.
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/CamoufoxGUI --self-check || true
          echo "--- self-check verdict ---"
          cat dist/CamoufoxGUI-selfcheck.log
          grep -q "self-check OK" dist/CamoufoxGUI-selfcheck.log

      - name: Self-check the bundle (macOS)
        # macOS CI runners have no window server, and Qt's offscreen plugin is
        # not shipped in the PySide6 wheel, so a QGuiApplication cannot start
        # here. The bundle is verified by the data-file step below instead.
        if: runner.os == 'macOS'
        run: |
          APP="dist/CamoufoxGUI.app/Contents/MacOS/CamoufoxGUI"
          echo "bundle executable: $(test -x "$APP" && echo present || echo MISSING)"
          test -x "$APP"

      - name: Self-check the bundle (Windows)
        # The exe is a GUI-subsystem build, so it has no console: --self-check
        # writes its verdict to a file and the exit code carries the result.
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          # Start-Process -Wait, not a plain call: PowerShell does not wait for
          # GUI-subsystem executables, so `&` returned immediately, $LASTEXITCODE
          # came back empty, and the log was read before it had been written.
          $p = Start-Process -FilePath "dist\CamoufoxGUI.exe" `
                             -ArgumentList "--self-check" -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"

          $log = "dist\CamoufoxGUI-selfcheck.log"
          if (-not (Test-Path $log)) {
            Write-Host "no self-check log was written"
            exit 1
          }
          Get-Content $log

          # Gated on the log rather than the exit code: the log is written before
          # the process exits, so it is the more reliable of the two signals.
          if (-not (Select-String -Path $log -Pattern "self-check OK" -Quiet)) {
            Write-Host "self-check did not report OK"
            exit 1
          }

      - name: Verify shipped data files
        # Asserts the assets a missing `datas` entry would strip, named
        # individually so a failure says which one vanished.
        #
        # A single-file build has no `_internal/` tree to look inside, so the
        # payload is read out of the executable's own CArchive instead. That is
        # also the stronger check: it inspects what the bootloader will extract,
        # not what happened to be sitting in a folder next to the binary.
        shell: bash
        run: |
          set -eu
          BIN="dist/CamoufoxGUI"
          # `if`, not `[ ... ] && ...`: under `set -e` a false test in an && list
          # aborts the step, which is how a Linux-only check would fail Windows.
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="dist/CamoufoxGUI.exe"
          fi
          # macOS wraps the executable in the .app, so the raw path is gone.
          if [ ! -f "$BIN" ] && [ -f "dist/CamoufoxGUI.app/Contents/MacOS/CamoufoxGUI" ]; then
            BIN="dist/CamoufoxGUI.app/Contents/MacOS/CamoufoxGUI"
          fi
          [ -f "$BIN" ] || { echo "no executable at $BIN"; ls -la dist; exit 1; }
          echo "reading archive from $BIN"

          python -m PyInstaller.utils.cliutils.archive_viewer -l "$BIN" > archive.raw
          # PyInstaller records archive names with the host's separator, so a
          # Windows build lists `camoufox\gui\qml\main.qml`. Normalise once here
          # rather than making every pattern below carry two spellings.
          tr '\\' '/' < archive.raw > archive.txt
          echo "archive entries: $(wc -l < archive.txt)"
          grep -c "PySide6" archive.txt | sed 's/^/PySide6 entries: /'

          for f in \
            camoufox/gui/qml/main.qml \
            camoufox/gui/assets/icon.ico \
            camoufox/browserforge.yml \
            camoufox/territoryInfo.xml \
            language_tags/data/json/index.json \
          ; do
            grep -q -- "'$f'" archive.txt || { echo "MISSING: $f"; exit 1; }
            echo "ok: $f"
          done
          # The fingerprint generator's Bayesian network, inside a sub-package.
          grep -q "input-network-definition.zip" archive.txt \
            || { echo "MISSING: apify input-network-definition.zip"; exit 1; }
          echo "ok: apify fingerprint data"
          # Playwright's Node driver, without which no browser launches. The
          # binary is `node` on POSIX and `node.exe` on Windows.
          grep -qE "playwright/driver/node(\.exe)?" archive.txt \
            || { echo "MISSING: playwright node driver"; exit 1; }
          echo "ok: playwright driver"
          # The Qt platform plugin: without it the extracted app cannot open a
          # window on the user's machine, and nothing else in this list would
          # notice, because the self-check runs offscreen.
          grep -qE "plugins/platforms/(qwindows\.dll|libqxcb\.so|libqcocoa\.dylib)" archive.txt \
            || { echo "MISSING: Qt platform plugin"; exit 1; }
          echo "ok: Qt platform plugin"

      - name: Report size
        shell: bash
        run: |
          du -h dist/CamoufoxGUI* 2>/dev/null || true
          du -h "${{ matrix.deliverable }}" 2>/dev/null || true

      - name: Package the deliverable
        # Windows and Linux ship the executable itself -- there is nothing to
        # unzip. macOS ships a zip of the .app, because a .app is a directory and
        # a bare download of one loses its structure and symlinks.
        shell: bash
        run: |
          set -eu
          cd dist
          case "${{ runner.os }}" in
            Windows)
              mv CamoufoxGUI.exe "${{ matrix.artifact }}.exe"
              ;;
            macOS)
              zip -qry "${{ matrix.artifact }}.zip" CamoufoxGUI.app
              ;;
            *)
              mv CamoufoxGUI "${{ matrix.artifact }}"
              ;;
          esac
          ls -lh "${{ matrix.artifact }}"* || true

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.deliverable }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to release
    needs: package
    # Only on a tag push: an artifact from a manual run has no release to
    # attach to, and inventing one would be surprising.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v6
        with:
          path: archives
          merge-multiple: true

      - name: List what will be published
        run: ls -lh archives

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          # One file per platform: the .exe and the bare Linux binary, plus the
          # macOS .app zip. Nothing else to attach.
          files: |
            archives/*.exe
            archives/CamoufoxGUI-linux-x64
            archives/*.zip
          # The tag already exists: it is what triggered this workflow.
          fail_on_unmatched_files: false
